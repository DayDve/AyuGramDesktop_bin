name: Build Linux Static

on:
  workflow_dispatch:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Install dependencies
        run: pipx install poetry

      - name: Build in Docker
        run: |
          mkdir -p .ccache
          chmod -R 777 .ccache 
          
          docker run --rm \
            -u 0:0 \
            -v "$GITHUB_WORKSPACE:/usr/src/tdesktop" \
            -v "$GITHUB_WORKSPACE/.ccache:/home/user/.ccache" \
            -e CCACHE_DIR=/home/user/.ccache \
            -e CCACHE_MAXSIZE=2G \
            ghcr.io/telegramdesktop/tdesktop/centos_env:latest \
            /bin/bash -c "yum install -y ccache && \
            chown -R user:user /usr/src/tdesktop && \
            su user -c '/usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
            -D TDESKTOP_API_ID=2040 \
            -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627 \
            -D CMAKE_C_COMPILER_LAUNCHER=ccache \
            -D CMAKE_CXX_COMPILER_LAUNCHER=ccache'"
            
      - name: Post-build Fixup
        run: sudo chown -R $USER:$USER out/

      - name: Locate and Process Binary
        run: |
          TARGET_BIN=$(find out -type f -name "Telegram" -executable | head -n 1)
          
          if [ -z "$TARGET_BIN" ]; then
            echo "!!! ОШИБКА: Бинарник не найден в папке out. Проверь логи сборки выше."
            exit 1
          fi
          
          echo "Нашел бинарник: $TARGET_BIN"
          strip -s "$TARGET_BIN"
          echo "TELEGRAM_PATH=$TARGET_BIN" >> $GITHUB_ENV

      - name: Compress with UPX
        run: |
          sudo apt-get update && sudo apt-get install -y upx
          upx --best "${{ env.TELEGRAM_PATH }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Linux-Static
          path: ${{ env.TELEGRAM_PATH }}    if-no-files-found: error
