name: Build Linux Static

on:
  workflow_dispatch:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Install dependencies
        run: pipx install poetry

      - name: Build in Docker
        run: |
          mkdir -p .ccache
          docker run --rm \
            -u $(id -u) \
            -v "$GITHUB_WORKSPACE:/usr/src/tdesktop" \
            -v "$GITHUB_WORKSPACE/.ccache:/.ccache" \
            -e CCACHE_DIR=/.ccache \
            ghcr.io/telegramdesktop/tdesktop/centos_env:latest \
            /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
            -D TDESKTOP_API_ID=2040 \
            -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627

      - name: Strip binary
        run: |
          # Находим именно финальный файл и очищаем его от отладочной инфы
          find out/Release -maxdepth 1 -name "Telegram" -type f -executable -exec strip -s {} +
      
      - name: Compress with UPX
        run: |
          sudo apt-get update && sudo apt-get install -y upx
          upx --best out/Release/Telegram

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Linux-Static
          # Указываем конкретный путь к релизному бинарнику
          path: out/Release/Telegram
          if-no-files-found: error
