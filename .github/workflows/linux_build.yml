name: Build Linux Static

on:
  workflow_dispatch:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-      - name: Post-build Fixup
        # Выдаем максимальные права на всю папку, игнорируя владельцев
        run: sudo chmod -R 777 out/

      - name: Process Binary
        run: |
          TARGET=$(find out -type f -executable -size +20M | head -n 1)
          if [ -z "$TARGET" ]; then
            echo "Файл не найден, вывожу список всего что собралось:"
            ls -R out/
            exit 1
          fi
          
          echo "Определен основной бинарник: $TARGET"
          
          # Делаем strip и перенос от имени суперпользователя для 100% гарантии
          sudo strip -s "$TARGET"
          sudo mv "$TARGET" ./AyuGram-Static
          
          # Даем права на чтение финальному файлу, чтобы экшен загрузки смог его прочитать и сжать
          sudo chmod 777 ./AyuGram-Static

      - name: Install dependencies
        run: pipx install poetry

      - name: Build in Docker
        run: |
          mkdir -p .ccache
          chmod -R 777 .ccache 
          
          docker run --rm \
            -u 0:0 \
            -v "$GITHUB_WORKSPACE:/usr/src/tdesktop" \
            -v "$GITHUB_WORKSPACE/.ccache:/home/user/.ccache" \
            -e CCACHE_DIR=/home/user/.ccache \
            -e CCACHE_MAXSIZE=2G \
            ghcr.io/telegramdesktop/tdesktop/centos_env:latest \
            /bin/bash -c "yum install -y ccache && \
            chown -R user:user /usr/src/tdesktop && \
            su user -c '/usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
            -D TDESKTOP_API_ID=2040 \
            -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627 \
            -D CMAKE_C_COMPILER_LAUNCHER=ccache \
            -D CMAKE_CXX_COMPILER_LAUNCHER=ccache'"
            
      - name: Post-build Fixup
        # Выдаем максимальные права на всю папку, игнорируя владельцев
        run: sudo chmod -R 777 out/

      - name: Process Binary
        run: |
          TARGET=$(find out -type f -executable -size +20M | head -n 1)
          if [ -z "$TARGET" ]; then
            echo "Файл не найден, вывожу список всего что собралось:"
            ls -R out/
            exit 1
          fi
          
          echo "Определен основной бинарник: $TARGET"
          
          # Делаем strip и перенос от имени суперпользователя для 100% гарантии
          sudo strip -s "$TARGET"
          sudo mv "$TARGET" ./AyuGram-Static
          
          # Даем права на чтение финальному файлу, чтобы экшен загрузки смог его прочитать и сжать
          sudo chmod 777 ./AyuGram-Static
          
      - name: Compress with UPX
        run: |
          sudo apt-get update && sudo apt-get install -y upx
          upx --best ./ayugram-binary

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Linux-Static
          path: ./ayugram-binary
          if-no-files-found: error
