name: Build Linux Static

on:
  workflow_dispatch:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify Submodules
        run: |
          git submodule status
          # Если какой-то сабмодуль пустой, попробуем дотянуть
          if git submodule status | grep -q "^-"; then
            echo "Some submodules are missing, initializing..."
            git submodule update --init --recursive
          fi

      - name: Extract Version
        run: |
          # Читаем версию из стандартного файла tdesktop
          if [ -f "Telegram/build/version" ]; then
            VERSION=$(grep "AppVersionStr " Telegram/build/version | awk '{print $2}' | tr -d '[:space:]')
          else
            VERSION="unknown"
          fi
          
          # Берем короткий хэш коммита для уникальности релиза
          SHORT_SHA=$(git rev-parse --short HEAD)
          
          echo "APP_VERSION=${VERSION}-${SHORT_SHA}" >> $GITHUB_ENV
          echo "Текущая версия: ${VERSION}-${SHORT_SHA}"

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Build in Docker
        run: |
          mkdir -p .ccache
          chmod -R 777 .ccache
          
          docker run --rm \
            -u 0:0 \
            -v "$GITHUB_WORKSPACE:/usr/src/tdesktop" \
            -v "$GITHUB_WORKSPACE/.ccache:/home/user/.ccache" \
            ghcr.io/telegramdesktop/tdesktop/centos_env:latest \
            /usr/src/tdesktop/scripts/build_linux.sh

      - name: Process Binary
        run: |
          BINARY="out/Release/AyuGram"
          
          if [ ! -f "$BINARY" ]; then
            echo "Error: $BINARY not found!"
            echo "Searching for AyuGram in out directory..."
            find out -name "AyuGram" -type f -executable
            exit 1
          fi
          
          echo "Found binary: $BINARY"
          ls -lh "$BINARY"
          
          # Копируем его в корень
          sudo cp "$BINARY" ./AyuGram
          sudo chmod 777 ./AyuGram
          
          # Стрипаем символы (уменьшает размер)
          sudo strip -s ./AyuGram
          
          echo "Final binary info:"
          ls -lh ./AyuGram
          file ./AyuGram

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Linux-Static
          path: ./AyuGram
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v$APP_VERSION" ./AyuGram \
            --title "AyuGram v$APP_VERSION" \
            --notes "Static binary for Linux."

      - name: Notify Success
        if: success()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ ! -f ./AyuGram ]; then
            echo "AyuGram binary not found, sending notification without file..."
            curl -sS --fail -F "chat_id=$TG_CHAT_ID" \
              -F "text=AyuGram v$APP_VERSION — Linux build succeeded (binary not available)" \
              "https://api.telegram.org/bot$TG_TOKEN/sendMessage"
          else
            curl -sS --fail -F "chat_id=$TG_CHAT_ID" \
              -F "document=@./AyuGram" \
              -F "caption=AyuGram v$APP_VERSION — Linux build succeeded" \
              "https://api.telegram.org/bot$TG_TOKEN/sendDocument"
          fi

      - name: Notify Failure
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          TEXT=$(printf '%s\n' \
            '❌ AyuGram Linux build failed' \
            "Workflow: ${{ github.workflow }}" \
            "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "Branch: ${{ github.ref_name }}" \
            "Commit: ${{ github.sha }}")
          curl -sS --fail -F "chat_id=$TG_CHAT_ID" \
            -F "text=$TEXT" \
            "https://api.telegram.org/bot$TG_TOKEN/sendMessage"
